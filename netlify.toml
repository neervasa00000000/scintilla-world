# Netlify — See-the-Route (scintilla.world)
# Static export published from /deploy (built from see-the-route).

[build]
  publish = "deploy"
  command = ""

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 301

[context.production.environment]
  NODE_ENV = "production"
