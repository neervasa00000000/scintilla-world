# Netlify — See-the-Route (scintilla.world)

[build]
  base = "see-the-route"
  command = "npm run generate-samples && npm run build"
  publish = "out"

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 301

[context.production.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
